services:
  ugcmaker:
    build: .
    container_name: ugcmaker
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SQLITE_JOURNAL_MODE: DELETE
    volumes:
      - ugcmaker-data:/app/data
      - ./uploads:/app/uploads
      - ./downloads:/app/downloads

volumes:
  ugcmaker-data:
